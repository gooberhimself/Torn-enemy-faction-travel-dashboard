<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friendly Travel</title>
  <link rel="stylesheet" href="/static/style.css?v=20260818-activity">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Friendly Travel</h1>
      <nav><a href="/">Enemy Travel</a><a href="/hospital">Enemy Hospital</a><a href="/activity">Activity</a><a href="/friendly/hospital">Friendly Hospital</a></nav>
    </div>
    <div id="updated">Loading…</div>
    <div id="error"></div>
  </header>

  <section class="cards">
    <div class="card"><div class="num" id="traveling">0</div><div>Traveling</div></div>
    <div class="card"><div class="num" id="abroad">0</div><div>Abroad</div></div>
    <div class="card"><div class="num" id="returning">0</div><div>Returning</div></div>
  </section>

  <section>
    <h2>By destination</h2>
    <div id="destinations"></div>
  </section>

  <section>
    <h2>Live changes</h2>
    <div id="changes"></div>
  </section>

  <section>
    <h2>All members</h2>
    <input id="filter" placeholder="Filter name/status/destination">
    <div id="members"></div>
  </section>

<script>
let latest = null;
const important = new Set(['Traveling','Abroad','Returning','Hospital']);

async function refresh(){
  try {
    const res = await fetch('/api/friendly/status', {cache:'no-store'});
    if(!res.ok) throw new Error(`Status request failed (${res.status})`);
    latest = await res.json();
    render();
  } catch(error) {
    document.getElementById('error').textContent = error.message;
  }
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  if(!latest) return;
  document.getElementById('updated').textContent = latest.updated_at ? `Updated ${latest.updated_at}` : 'Waiting for first poll…';
  document.getElementById('error').textContent = latest.error || '';

  const counts = {Traveling:0, Abroad:0, Returning:0};
  latest.members.forEach(m => { if(counts[m.state] !== undefined) counts[m.state]++; });
  document.getElementById('traveling').textContent = counts.Traveling;
  document.getElementById('abroad').textContent = counts.Abroad;
  document.getElementById('returning').textContent = counts.Returning;

  const destinations = document.getElementById('destinations');
  const keys = Object.keys(latest.grouped).sort();
  destinations.innerHTML = keys.length ? keys.map(key => `
    <details open class="group"><summary>${esc(key)} <b>${latest.grouped[key].length}</b></summary>
      ${latest.grouped[key].map(memberRow).join('')}
    </details>`).join('') : '<div class="empty">No friendly travel visible right now.</div>';

  const changes = document.getElementById('changes');
  changes.innerHTML = latest.changes.length ? latest.changes.map(change => `
    <div class="change"><b>${esc(change.time)}</b> ${esc(change.name)} → ${esc(change.new)}</div>`).join('') : '<div class="empty">No changes yet.</div>';

  renderMembers();
}

function memberRow(member){
  const cls = important.has(member.state) ? 'hot' : '';
  return `<a class="member ${cls}" href="${member.profile_url}" target="_blank" rel="noopener">
    <div><b>${esc(member.name)}</b> <span class="muted">[${esc(member.id)}]</span></div>
    <div>${esc(member.state)} ${member.destination ? '• ' + esc(member.destination) : ''}</div>
    <small>${esc(member.status_text)}</small>
    ${arrivalInfo(member)}
  </a>`;
}

function arrivalInfo(member){
  if(!['Traveling','Returning'].includes(member.state)) return '';
  const until = member.until || member.estimated_until;
  if(!until) return '<div class="arrival unavailable">Arrival time unavailable from Torn API</div>';
  const displayLabel = member.arrival_estimated
    ? (member.state === 'Returning' ? 'Estimated return' : 'Estimated landing')
    : (member.state === 'Returning' ? 'Returns' : 'Lands');
  const time = new Date(until * 1000);
  const arrivalTime = time.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'});
  return `<div class="arrival">
    ${displayLabel} at <time datetime="${time.toISOString()}" title="${esc(time.toLocaleString())}">${esc(arrivalTime)}</time>
    <span class="countdown" data-until="${until}"></span>
  </div>`;
}

function updateCountdowns(){
  const now = Date.now();
  document.querySelectorAll('.countdown').forEach(element => {
    const remaining = Math.max(0, Number(element.dataset.until) * 1000 - now);
    if(remaining <= 0){
      element.textContent = '(arriving now)';
      return;
    }
    const totalSeconds = Math.ceil(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const parts = hours ? [hours, minutes, seconds] : [minutes, seconds];
    element.textContent = `(${parts.map(value => String(value).padStart(2, '0')).join(':')} remaining)`;
  });
}

function renderMembers(){
  const query = document.getElementById('filter').value.toLowerCase();
  const members = latest.members.filter(member => JSON.stringify(member).toLowerCase().includes(query));
  document.getElementById('members').innerHTML = members.map(memberRow).join('');
  updateCountdowns();
}

document.getElementById('filter').addEventListener('input', renderMembers);
refresh();
setInterval(refresh, 30000);
setInterval(updateCountdowns, 1000);
</script>
</body>
</html>
