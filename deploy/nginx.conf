server {
    listen 8080;
    # Keep redirects relative behind the HTTPS Cloudflare Tunnel.
    absolute_redirect off;
    server_name tracker.example.com www.tracker.example.com;

    location /instance-a/ {
        proxy_pass http://127.0.0.1:8787/;

        # Chain SSE: flush each event and allow heartbeat-maintained streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /instance-a {
        return 301 /instance-a/;
    }

    # Instance B will eventually run on 8788
    location /instance-b/ {
        proxy_pass http://127.0.0.1:8788/;

        # Chain SSE: flush each event and allow heartbeat-maintained streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /instance-b {
        return 301 /instance-b/;
    }
}
